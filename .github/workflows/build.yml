name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  simulation:
    # The driver samples need a zenon installation (CopaData.Drivers.Contracts.dll) and are not built here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build simulators
        run: |
          dotnet build Simulation/MqttSimulatorClient
          dotnet build Simulation/RestSimulatorService

      - name: Test
        run: dotnet test Simulation/SensorSimulator.Tests
